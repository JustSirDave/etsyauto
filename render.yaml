# Render Blueprint for Etsy Automation Platform
# Free Tier Configuration

services:
  # PostgreSQL Database (Free for 90 days)
  - type: pserv
    name: etsy-db
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile.db
    envVars:
      - key: POSTGRES_DB
        value: etsy_platform
      - key: POSTGRES_USER
        value: postgres
      - key: POSTGRES_PASSWORD
        generateValue: true

  # FastAPI Backend (Free - sleeps after 15 min)
  - type: web
    name: etsy-api
    env: docker
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: etsy-db
          property: connectionString
      - key: REDIS_URL
        value: # You'll add Upstash Redis URL here
      - key: JWT_PRIVATE_KEY
        sync: false
      - key: JWT_PUBLIC_KEY
        sync: false
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: ETSY_CLIENT_ID
        sync: false
      - key: ETSY_CLIENT_SECRET
        sync: false
      - key: ETSY_REDIRECT_URI
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: FRONTEND_URL
        fromService:
          type: web
          name: etsy-web
          property: host
    healthCheckPath: /healthz

  # Next.js Frontend (Free static site)
  - type: web
    name: etsy-web
    env: static
    plan: free
    buildCommand: cd apps/web && npm install && npm run build
    staticPublishPath: ./apps/web/.next
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: etsy-api
          property: host
      - key: NEXT_PUBLIC_GOOGLE_CLIENT_ID
        sync: false
      - key: NEXTAUTH_SECRET
        generateValue: true

databases:
  - name: etsy-db
    plan: free
    databaseName: etsy_platform
    user: postgres
